name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch vendored submodules
        shell: bash
        run: |
          if [ -f third_party/palloc/include/palloc_vector.h ]; then
            sed -i 's/static inline pa_decl_nodiscard/pa_decl_nodiscard static inline/g' third_party/palloc/include/palloc_vector.h
          fi

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Setup CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Configure CMake
        run: cmake -S . -B build -DPOMAI_BUILD_TESTS=ON -DPOMAI_BUILD_BENCH=OFF -DPOMAI_REGISTER_BENCH_CTEST=ON

      - name: Build Core Engine & C-API
        run: cmake --build build --config Release --parallel

      - name: Run Core CTests
        env:
          POMAI_SKIP_VULKAN_TESTS: 1
        run: ctest --test-dir build --output-on-failure -C Release --timeout 300 -E bench

      - name: Test Python SDK & Binding
        env:
          PYTHONPATH: ${{ github.workspace }}/bindings/python:${{ github.workspace }}/sdk/python
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
          POMAI_C_LIB: ${{ github.workspace }}/build/libpomai_c.so
        run: |
          python tests/python_api_completeness_test.py
          cd bindings/python
          python -m unittest tests/test_binding.py

      - name: Test JavaScript Binding
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
          POMAI_C_LIB: ${{ github.workspace }}/build/libpomai_c.so
        run: |
          cd bindings/javascript
          npm install
          npm test

      - name: Test Rust Binding
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
          POMAIDB_LIB_DIR: ${{ github.workspace }}/build
        run: |
          cd bindings/rust
          cargo test

      - name: Test Go Binding
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
        run: |
          cd bindings/go
          go test -v ./...