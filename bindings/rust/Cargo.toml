[package]
name = "pomaidb"
version = "0.2.0"
edition = "2021"
authors = ["PomaiDB Team <info@pomaidb.org>"]
description = "Embedded vector database for Edge AI - official Rust bindings"
license = "Apache-2.0"
repository = "https://github.com/pomagrenate/pomaidb"
homepage = "https://pomaidb.org"
readme = "README.md"
keywords = ["vector", "database", "embeddings", "hnsw", "edge-ai"]
categories = ["database-implementations", "science"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[build-dependencies]